<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123c37"/>
      <stop offset="1" stop-color="#082622"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D3B36"/>
      <stop offset="1" stop-color="#0a2622"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFC978"/>
      <stop offset="1" stop-color="#D9A441"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="130" cy="96" r="120" fill="#D9A441" opacity="0.10"/>
  <circle cx="410" cy="430" r="140" fill="#7FA684" opacity="0.10"/>

  <!-- playing-card pair behind the shield for the "game" cue -->
  <rect x="150" y="150" width="150" height="204" rx="16" fill="#7FA684" opacity="0.35" transform="rotate(-10 225 252)"/>
  <rect x="212" y="150" width="150" height="204" rx="16" fill="#EFC978" opacity="0.35" transform="rotate(9 287 252)"/>

  <!-- shield -->
  <path d="M256 88 L368 126 V254 C368 336 320 392 256 424 C192 392 144 336 144 254 V126 Z"
        fill="url(#shield)" stroke="url(#gold)" stroke-width="10"/>

  <!-- checkmark -->
  <path d="M202 254 L240 292 L318 206" fill="none" stroke="url(#gold)" stroke-width="26"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
