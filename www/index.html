<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Karapatan Cards</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="img/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="phone">
    <!-- Splash screen -->
    <div class="splash" id="splash">
      <div class="splash-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v3M12 6 7 8v3c0 2.5 1.8 4.3 3.5 5M12 6l5 2v3c0 2.5-1.8 4.3-3.5 5" fill="none"/>
          <path d="M7 8 4.5 13.5a2.4 2.4 0 0 0 5 0Z"/>
          <path d="M17 8l-2.5 5.5a2.4 2.4 0 0 0 5 0Z"/>
          <path d="M12 16.5V20"/>
          <path d="M9 20h6"/>
          <path d="M5 12c-1 2-1 4.5 1 6M19 12c1 2 1 4.5-1 6" stroke="var(--gold-soft)" stroke-width="1"/>
        </svg>
      </div>
      <div class="splash-title serif-title">Karapatan Cards</div>
      <div class="splash-sub rounded">Know your rights. Play your part.</div>
      <div class="splash-dots"><span></span><span></span><span></span></div>
    </div>

    <button class="pause-btn" id="pauseBtn" onclick="openPause()" aria-label="Pause menu"><span class="bar"></span><span class="bar"></span></button>
    <div class="screen" id="screen"></div>
    <div class="controls" id="controls"></div>

    <!-- Pause menu -->
    <div class="pause-overlay" id="pauseOverlay">
      <div class="pause-menu">
        <div class="pause-icon-circle"><span class="bar"></span><span class="bar"></span></div>
        <div class="pause-title serif-title">Paused</div>
        <div class="pause-sub" id="pauseSub"></div>
        <button class="btn btn-primary" onclick="closePause()"><span class="play-tri"></span> Resume</button>
        <button class="btn btn-outline pause-item" onclick="pauseGoScoreboard()"><svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4Z"/><path d="M7 5H4a1 1 0 0 0-1 1v1a4 4 0 0 0 4 4M17 5h3a1 1 0 0 1 1 1v1a4 4 0 0 1-4 4"/></svg> View Scoreboard</button>
        <button class="btn btn-outline pause-item" onclick="toggleSound(); openPause();"><svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg> Toggle Sound</button>
        <button class="btn btn-outline pause-item danger" onclick="pauseQuit()"><svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg> Quit to Menu</button>
        <div class="pause-flourish">◆</div>
      </div>
    </div>

    <!-- Language picker -->
    <div class="pause-overlay" id="langOverlay">
      <div class="pause-menu">
        <div class="pause-title serif-title" id="langPickerTitle">Choose Language</div>
        <div class="pause-sub" id="langPickerSub">Switches every menu instantly.</div>
        <div id="langList" style="display:flex;flex-direction:column;gap:10px;"></div>
        <button class="btn btn-outline pause-item" style="margin-top:2px;" onclick="closeLangPicker()">Cancel</button>
      </div>
    </div>

    <!-- How to play -->
    <div class="pause-overlay" id="howtoOverlay">
      <div class="pause-menu">
        <div class="pause-title serif-title">How to Play</div>
        <div class="pause-sub"></div>
        <button class="btn btn-primary" onclick="closeHowTo()">Got it</button>
      </div>
    </div>
  </div>

<script src="js/data.js"></script>
<script src="js/translations.js"></script>
<script src="js/audio.js"></script>
<script src="js/ai.js"></script>
<script src="js/net-protocol.js"></script>
<script src="js/net-transport.js"></script>
<script src="js/local-play-ui.js"></script>
<script src="js/game.js"></script>
</body>
</html>
