<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Karapatan Cards</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="img/icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="phone">
    <!-- Splash screen -->
    <div class="splash" id="splash">
      <div class="splash-scale">
        <svg viewBox="0 0 100 100" width="84" height="84">
          <path d="M38 92 h24 a3 3 0 0 0 0-6 h-24 a3 3 0 0 0 0 6 Z" fill="var(--gold)"/>
          <rect x="47.5" y="30" width="5" height="58" rx="1.5" fill="var(--gold)"/>
          <circle cx="50" cy="26" r="4" fill="var(--gold)"/>
          <g class="scale-beam">
            <line x1="20" y1="26" x2="80" y2="26" stroke="var(--gold)" stroke-width="3" stroke-linecap="round"/>
            <line x1="20" y1="26" x2="20" y2="46" stroke="var(--gold-soft)" stroke-width="1.6"/>
            <path d="M10 46 Q20 60 30 46" fill="none" stroke="var(--gold)" stroke-width="3" stroke-linecap="round"/>
            <line x1="80" y1="26" x2="80" y2="46" stroke="var(--gold-soft)" stroke-width="1.6"/>
            <path d="M70 46 Q80 60 90 46" fill="none" stroke="var(--gold)" stroke-width="3" stroke-linecap="round"/>
          </g>
        </svg>
      </div>
      <div class="splash-title rounded">Karapatan Cards</div>
      <div class="splash-sub rounded">Know your rights. Play your part.</div>
      <div class="splash-dots"><span></span><span></span><span></span></div>
    </div>

    <button class="pause-btn" id="pauseBtn" onclick="openPause()" aria-label="Pause menu"><span class="bar"></span><span class="bar"></span><span class="pause-label">Pause</span></button>
    <div class="screen" id="screen"></div>
    <div class="controls" id="controls"></div>

    <!-- Pause menu -->
    <div class="pause-overlay" id="pauseOverlay">
      <div class="pause-menu">
        <div class="pause-title">Paused</div>
        <div class="pause-sub" id="pauseSub"></div>
        <button class="btn btn-primary" onclick="closePause()"><span class="play-tri"></span> Resume</button>
        <button class="btn btn-outline pause-item" onclick="pauseGoScoreboard()"><svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4Z"/><path d="M7 5H4a1 1 0 0 0-1 1v1a4 4 0 0 0 4 4M17 5h3a1 1 0 0 1 1 1v1a4 4 0 0 1-4 4"/></svg> View Scoreboard</button>
        <div class="audio-settings">
          <div class="audio-row">
            <span class="audio-label">Sound Effects</span>
            <button class="audio-toggle-btn" id="sfxToggleBtn" onclick="toggleSfxFromPause()"></button>
          </div>
          <input type="range" class="audio-slider" id="sfxVolumeSlider" min="0" max="100" oninput="onSfxVolumeInput(this.value)">
          <div class="audio-row">
            <span class="audio-label">Music</span>
            <button class="audio-toggle-btn" id="musicToggleBtn" onclick="toggleMusicFromPause()"></button>
          </div>
          <input type="range" class="audio-slider" id="musicVolumeSlider" min="0" max="100" oninput="onMusicVolumeInput(this.value)">
        </div>
        <button class="btn btn-outline pause-item danger" onclick="pauseQuit()"><svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg> Quit to Menu</button>
      </div>
    </div>

    <!-- Language picker -->
    <div class="pause-overlay" id="langOverlay">
      <div class="pause-menu">
        <div class="pause-title" id="langPickerTitle">Choose Language</div>
        <div class="pause-sub" id="langPickerSub">Switches every menu instantly.</div>
        <div id="langList" style="display:flex;flex-direction:column;gap:10px;"></div>
        <button class="btn btn-outline pause-item" style="margin-top:2px;" onclick="closeLangPicker()">Cancel</button>
      </div>
    </div>

    <!-- How to play -->
    <div class="pause-overlay" id="howtoOverlay">
      <div class="pause-menu howto-menu">
        <img class="howto-guide-img" src="assets/customizable/lady-liberty-guide.png" alt="">
        <div class="pause-title">How to Play</div>
        <div class="pause-sub"></div>
        <button class="btn btn-primary" onclick="closeHowTo()">Got it</button>
      </div>
    </div>
  </div>

<script src="js/data.js"></script>
<script src="js/translations.js"></script>
<script src="js/audio.js"></script>
<script src="js/ai.js"></script>
<script src="js/net-protocol.js"></script>
<script src="js/net-transport.js"></script>
<script src="js/local-play-ui.js"></script>
<script src="js/game.js"></script>
</body>
</html>
